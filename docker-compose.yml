  db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=pinpoint
      - POSTGRES_PASSWORD=pinpoint
      - POSTGRES_DB=pinpoint
    ports:
      - 5433:5432

  test-db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - 5432:5432

  adminer:
    image: adminer
    ports:
      - 8080:8080
    depends_on:
      - db
